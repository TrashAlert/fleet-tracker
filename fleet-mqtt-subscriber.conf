[program:fleet-mqtt-subscriber]
command=/usr/bin/php /var/www/fleet-tracker/artisan mqtt:subscribe
directory=/var/www/fleet-tracker
user=www-data

; Exactly ONE subscriber. A second instance would receive every telemetry packet
; too, doubling GpsTelemetry rows and derived alerts. Never raise this.
numprocs=1

; Start on boot; restart on any exit. The client now auto-reconnects in-process
; on a dropped broker connection (config/mqtt-client.php auto_reconnect); Supervisor
; autorestart is the backstop for when reconnect attempts are exhausted and the
; process exits.
autostart=true
autorestart=true
; Must stay up this long to count as "successfully started".
startsecs=3
; Ride out a brief broker outage at (re)start before giving up as FATAL.
startretries=10

; Graceful stop: SIGTERM, then wait for an in-flight packet to finish its DB
; writes before SIGKILL. Matters on the post-deploy `supervisorctl restart`.
stopsignal=TERM
stopwaitsecs=20

redirect_stderr=true
stdout_logfile=/var/www/fleet-tracker/storage/logs/mqtt-subscriber.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=HOME="/var/www",USER="www-data"
